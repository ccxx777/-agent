<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" data-generator="fireworks-tech-graph" data-schema-version="1" data-style-id="1" data-visual-theme="flat-icon" data-diagram-type="data-flow" data-semantic-profile="generic" data-quality-profile="standard" data-min-node-gap="40" data-min-container-gutter="20" data-min-label-clearance="4" data-min-segment-length="16">
<title id="title">合同条款与事实提取：结构化 Schema、证据定位和确认边界</title>
<desc id="desc">展示脱敏页文本经过确定性条款切分、模型候选事实提取、本地证据定位、事实规范化和 PostgreSQL 持久化的流程；法律风险规则不在本模块内。</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei','Microsoft JhengHei','SimHei',sans-serif;}</style>
