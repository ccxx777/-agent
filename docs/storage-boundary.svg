<text x="58" y="140" fill="#111827" font-size="17px" font-weight="600" text-anchor="start" opacity="1.0">JSON / JSONL 文件工件</text>
<text x="58" y="162" fill="#6b7280" font-size="11px" font-weight="400" text-anchor="start" opacity="1.0">离线输入、评测输出、断点状态；不是生产会话真相</text>
