<text x="126" y="522" fill="#6b7280" font-size="11px" font-weight="400" text-anchor="start" opacity="1.0">legal-ingest-state/*.json</text>
<text x="126" y="565" fill="#9333ea" font-size="11px" font-weight="600" text-anchor="start" opacity="1.0">resume / 调试</text>
<rect x="64" y="640" width="264" height="142" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="80" y="672" fill="#ea580c" font-size="14px" font-weight="600" text-anchor="start" opacity="1.0">边界提醒</text>
<text x="80" y="700" fill="#111827" font-size="12px" font-weight="400" text-anchor="start" opacity="1.0">JSON 文件不会作为合同问答</text>
<text x="80" y="721" fill="#111827" font-size="12px" font-weight="400" text-anchor="start" opacity="1.0">的生产上下文来源。</text>
<text x="80" y="750" fill="#6b7280" font-size="11px" font-weight="400" text-anchor="start" opacity="1.0">生产合同数据走 PostgreSQL + 私有文件存储。</text>
