<rect x="420" y="280" width="6" height="106" rx="3" fill="#9333ea"/>
<text x="438" y="309" fill="#111827" font-size="14px" font-weight="600" text-anchor="start" opacity="1.0">解析、脱敏、事实提取</text>
<text x="438" y="332" fill="#6b7280" font-size="11px" font-weight="400" text-anchor="start" opacity="1.0">PDF / DOC / DOCX → 脱敏页文本 + facts JSON</text>
