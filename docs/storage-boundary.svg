<text x="42" y="45" fill="#111827" font-size="26px" font-weight="600" text-anchor="start" opacity="1.0">存储边界：JSON 文件 vs PostgreSQL 生产数据</text>
<text x="42" y="73" fill="#6b7280" font-size="14px" font-weight="400" text-anchor="start" opacity="1.0">合同正文、事实 JSON、风险报告和会话上下文的真实落点</text>
