<text x="438" y="502" fill="#6b7280" font-size="11px" font-weight="400" text-anchor="start" opacity="1.0">读取正文、确认事实、风险报告，形成 contract_context</text>
<rect x="420" y="620" width="290" height="86" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
