<text x="1128" y="794" font-size="10px" fill="#ffffff" font-weight="700" text-anchor="middle">?</text>
<text x="1154" y="788" font-size="15px" fill="#111827" font-weight="600" text-anchor="start">用户确认 / 重传</text>
<text x="1154" y="812" font-size="12px" fill="#4b5563" font-weight="400" text-anchor="start">事实表单、补充或质量回问</text>
<rect x="1268" y="819" width="68" height="20" rx="10" fill="#dbeafe"/>
<text x="1302" y="833" font-size="10px" fill="#1d4ed8" font-weight="600" text-anchor="middle">已接入</text>
