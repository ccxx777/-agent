<text x="1320" y="322" font-size="11px" fill="#9333ea" font-weight="600" text-anchor="middle">后台处理</text>
<path id="e-parser-classify" data-graph-role="edge" data-source="pdf-parser" data-target="page-classifier" d="M1400 453 V485" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path id="e-classify-native" data-graph-role="edge" data-source="page-classifier" data-target="native-text" d="M1280 529 H1170 V615" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="1215" y="555" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">native</text>
<path id="e-classify-ocr" data-graph-role="edge" data-source="page-classifier" data-target="ocr" d="M1520 529 V615 H1350" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
