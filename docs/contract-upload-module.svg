<rect x="70" y="890" width="1460" height="82" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.2"/>
<text x="95" y="919" font-size="13px" fill="#9a3412" font-weight="700" text-anchor="start">隐私边界</text>
<text x="95" y="944" font-size="12px" fill="#4b5563" font-weight="400" text-anchor="start">原始 PDF/DOC/DOCX 只保存在私有目录；脱敏后的页文本才允许进入 Embedding、Reranker、LLM 和日志。</text>
<text x="820" y="919" font-size="13px" fill="#9a3412" font-weight="700" text-anchor="start">远程 OCR 提醒</text>
<text x="820" y="944" font-size="12px" fill="#4b5563" font-weight="400" text-anchor="start">开启远程 OCR 时原始扫描图片会离开服务器，privacy.external_raw_image_sent 会被记录。</text>
</svg>
