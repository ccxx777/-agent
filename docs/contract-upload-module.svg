<text x="1154" y="232" font-size="12px" fill="#4b5563" font-weight="400" text-anchor="start">queued / extracting / ready</text>
<rect x="1218" y="239" width="68" height="20" rx="10" fill="#dcfce7"/>
<text x="1252" y="253" font-size="10px" fill="#166534" font-weight="600" text-anchor="middle">已完成</text>
</g>
