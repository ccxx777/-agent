<text x="774" y="788" font-size="15px" fill="#111827" font-weight="600" text-anchor="start">LangGraph Workflow</text>
<text x="774" y="812" font-size="12px" fill="#4b5563" font-weight="400" text-anchor="start">事实门禁 → 法律检索 → 报告</text>
<rect x="878" y="819" width="68" height="20" rx="10" fill="#dbeafe"/>
<text x="912" y="833" font-size="10px" fill="#1d4ed8" font-weight="600" text-anchor="middle">已接入</text>
</g>
