<text x="505" y="742" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">ready</text>
<path id="e-extraction-workflow" data-graph-role="edge" data-source="clause-extraction" data-target="workflow" d="M680 808 H720" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="700" y="794" font-size="11px" fill="#059669" font-weight="600" text-anchor="middle">facts</text>
