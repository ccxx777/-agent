<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">合同上传与 PDF、DOC、DOCX 解析模块</title>
<desc id="desc">展示合同 PDF、DOC、DOCX 从上传、私有存储、任务状态、文字解析、可选 OCR、脱敏到质量门禁的流程。</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei','Microsoft JhengHei','SimHei',sans-serif;}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
</defs>
<rect data-graph-role="background" width="1600" height="1050" fill="#ffffff"/>
<text x="60" y="48" font-size="26px" fill="#111827" font-weight="600" text-anchor="start">合同上传模块：PDF / DOC / DOCX 接入、解析与脱敏</text>
<text x="60" y="78" font-size="14px" fill="#6b7280" font-weight="400" text-anchor="start">首版接入 PDF、DOC、DOCX；PDF 扫描/混合页进入可插拔 OCR，Word 文件提取正文后统一脱敏。</text>
<text x="1120" y="42" font-size="12px" fill="#6b7280" font-weight="600" text-anchor="start">图例</text>
<line x1="1120" y1="60" x2="1150" y2="60" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="1158" y="64" font-size="12px" fill="#374151" font-weight="400" text-anchor="start">主流程</text>
<line x1="1240" y1="60" x2="1270" y2="60" stroke="#9333ea" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrow-purple)"/>
<text x="1278" y="64" font-size="12px" fill="#374151" font-weight="400" text-anchor="start">后台任务</text>
<line x1="1370" y1="60" x2="1400" y2="60" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="1408" y="64" font-size="12px" fill="#374151" font-weight="400" text-anchor="start">隐私 / OCR</text>
<rect data-graph-role="container" x="45" y="112" width="1510" height="210" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.4"/>
<rect data-graph-role="container" x="45" y="365" width="1510" height="515" rx="14" fill="#fffdf8" stroke="#fed7aa" stroke-width="1.4"/>
<text x="70" y="142" font-size="16px" fill="#1d4ed8" font-weight="600" text-anchor="start">在线接入层</text>
<text x="70" y="395" font-size="16px" fill="#9a3412" font-weight="600" text-anchor="start">私有文档处理层</text>
<path id="e-user-api" data-graph-role="edge" data-source="user" data-target="upload-api" d="M240 225 H300" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path id="e-api-validate" data-graph-role="edge" data-source="upload-api" data-target="validate" d="M500 225 H560" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<path id="e-validate-storage" data-graph-role="edge" data-source="validate" data-target="private-storage" d="M780 225 H840" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="810" y="170" font-size="11px" fill="#059669" font-weight="600" text-anchor="middle">原始文件</text>
