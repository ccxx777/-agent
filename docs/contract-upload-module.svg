</g>
<g id="upload-api" data-graph-role="node"><rect x="300" y="180" width="200" height="88" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
<circle cx="328" cy="209" r="17" fill="#009688"/>
