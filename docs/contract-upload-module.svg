<text x="895" y="641" font-size="11px" fill="#2563eb" font-weight="600" text-anchor="middle">页文本</text>
<path id="e-redact-quality" data-graph-role="edge" data-source="redact" data-target="quality" d="M650 659 H600" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
<text x="625" y="641" font-size="11px" fill="#ea580c" font-weight="600" text-anchor="middle">脱敏文本</text>
