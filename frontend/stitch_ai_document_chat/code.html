<script>
        // Auto-resize textarea
        const textarea = document.querySelector('textarea');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() !== '') {
                document.querySelector('.bg-primary').removeAttribute('disabled');
            } else {
                document.querySelector('.bg-primary').setAttribute('disabled', 'true');
            }
        });

        // Upload Menu Toggle
        const uploadBtn = document.getElementById('upload-btn');
        const uploadMenu = document.getElementById('upload-menu');
        const uploadIcon = document.getElementById('upload-icon');
        let isUploadMenuOpen = false;

        uploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isUploadMenuOpen = !isUploadMenuOpen;
            if(isUploadMenuOpen) {
                uploadMenu.classList.remove('scale-95', 'opacity-0', 'pointer-events-none');
                uploadMenu.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                uploadIcon.style.transform = 'rotate(45deg)';
            } else {
                uploadMenu.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
                uploadMenu.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                uploadIcon.style.transform = 'rotate(0deg)';
            }
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if(isUploadMenuOpen && !uploadBtn.contains(e.target) && !uploadMenu.contains(e.target)) {
                isUploadMenuOpen = false;
                uploadMenu.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
                uploadMenu.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                uploadIcon.style.transform = 'rotate(0deg)';
            }
        });

        // Mobile Sidebar Toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        let isSidebarOpen = false;

        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        mobileMenuBtn?.addEventListener('click', toggleSidebar);
        overlay?.addEventListener('click', toggleSidebar);

        // Initial setup for mobile
        if (window.innerWidth < 768) {
            sidebar.classList.add('-translate-x-full');
        }
        
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.add('hidden');
                isSidebarOpen = false;
            } else {
                if(!isSidebarOpen) sidebar.classList.add('-translate-x-full');
            }
        });
        
        // Theme toggle logic (basic class toggle for demonstration)
        const themeToggle = document.getElementById('theme-toggle');
        if(themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });
        }
    </script>
